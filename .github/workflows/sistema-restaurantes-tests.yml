name: Sistema Restaurantes - testes
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Checar sintaxe
        run: |
          node --check server.mjs
          node --check public/app.js
      - name: Testar API e sincronização
        run: npm test
